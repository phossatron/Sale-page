<!-- แถบเครื่องมือแก้ไข -->
<div id="toolbar" class="toolbar">
  <button id="tb-toggle" class="tb-toggle" title="ย่อ/ขยายแถบเครื่องมือ">⚙</button>
  <div class="tb-body">
    <button id="btn-edit" class="tb-btn main">✏️ โหมดแก้ไข</button>
    <button id="btn-preview" class="tb-btn">👁 มุมมองผู้เข้าชม</button>
    <button id="btn-save" class="tb-btn">💾 บันทึก</button>
    <button id="btn-publish" class="tb-btn publish">🚀 เผยแพร่ขึ้นเว็บ</button>
    <button id="btn-code" class="tb-btn">📦 สร้างไฟล์ content.js</button>
    <button id="btn-export" class="tb-btn">⬇️ ส่งออก JSON</button>
    <button id="btn-import" class="tb-btn">⬆️ นำเข้า JSON</button>
    <button id="btn-scan" class="tb-btn">🔍 ตรวจหาจุดตกขอบ</button>
    <button id="btn-reset" class="tb-btn danger">↺ คืนค่าเริ่มต้น</button>
    <button id="btn-lock" class="tb-btn danger">🔒 ล็อกโหมดแก้ไข</button>
    <input id="file-import" type="file" accept="application/json" hidden>
  </div>
</div>

<div id="preview" class="preview"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
